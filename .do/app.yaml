name: bridgewise
region: sgp
services:
  - name: web
    github:
      repo: joepro0118-create/MLH
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GEMMA_MODEL
        scope: RUN_TIME
        value: gemma-4-26b-a4b-it
      - key: MOCK_MODE
        scope: RUN_TIME
        value: "false"
